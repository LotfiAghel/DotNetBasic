name: Docker Image CI

on:
  push:
    branches: [ "migrate-to-dotnet-and-ef-to-8 " ]
  pull_request:
    branches: [ "migrate-to-dotnet-and-ef-to-8 " ]

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      tradebase-changed: ${{ steps.filter.outputs.tradebase }}
    steps:
      - uses: actions/checkout@v3
      - name: Check for changes
        id: filter
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -qE '^(Dockerfile7|Basics/)'; then
            echo "::set-output name=tradebase::true"
          else
            echo "::set-output name=tradebase::false"
          fi
  build-tradebase:

    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.tradebase-changed == 'true'
    steps:
    - uses: actions/checkout@v3
      with:
          submodules: recursive
          token: ${{ secrets.token2 }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username:  ${{ github.actor }}
        password: ${{ secrets.token2 }}
    - name: Build base8 Docker image
      run: |
          docker buildx build \
            --cache-from=type=registry,ref=ghcr.io/lotfiaghel/testhelper.net/base8-cache:latest \
            --cache-to=type=registry,ref=ghcr.io/lotfiaghel/testhelper.net/base8-cache:latest,mode=max \
            --load \
            -t base8:dev -f ./Dockerfile7 .
    - name: set tag
      run: docker image tag base8:dev ghcr.io/lotfiaghel/base8:dev
    - name: push image
      run: docker image push ghcr.io/lotfiaghel/base8:dev
    

    - name: Build tradeBase Docker image
      run: |
          docker buildx build \
            --cache-from=type=registry,ref=ghcr.io/lotfiaghel/testhelper.net/tradebase8-cache:latest \
            --cache-to=type=registry,ref=ghcr.io/lotfiaghel/testhelper.net/tradebase8-cache:latest,mode=max \
            --load \
            -t tradebase8:dev -f ./Dockerfile .
    - name: set tag
      run: docker image tag tradebase8:dev ghcr.io/lotfiaghel/tradebase8:dev
    - name: push image
      run: docker image push ghcr.io/lotfiaghel/tradebase8:dev


  build-webapplication:

    runs-on: ubuntu-latest
    needs: [build-tradebase]
    if: always()
    steps:
    - uses: actions/checkout@v3
      with:
          submodules: recursive
          token: ${{ secrets.token2 }}
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username:  ${{ github.actor }}
        password: ${{ secrets.token2 }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-webapp-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-webapp-
 
    
    - name: Build WebApplication Docker image
      run: |
        GIT_COMMIT=$(git rev-parse HEAD)
        docker buildx build \
          --cache-from=type=registry,ref=ghcr.io/lotfiaghel/testhelper.net/webapp-cache:latest \
          --cache-to=type=registry,ref=ghcr.io/lotfiaghel/testhelper.net/webapp-cache:latest,mode=max \
          --load \
          -t webapplication:latest \
          --build-arg GIT_COMMIT=${GIT_COMMIT} \
          -f ./WebApplication/Dockerfile .
    - name: set tag
      run: docker image tag webapplication:latest ghcr.io/lotfiaghel/web-server:latest
    - name: push image
      run: docker image push ghcr.io/lotfiaghel/web-server:latest
    - name: Deploy and restart web-server
      run: |
          curl http://213.108.240.78:5000/webhook

  build-admin-server:    
    runs-on: ubuntu-latest
    needs: build-tradebase
    if: success()
    steps:
    - uses: actions/checkout@v3
      with:
          submodules: recursive
          token: ${{ secrets.token2 }}
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username:  ${{ github.actor }}
        password: ${{ secrets.token2 }}
    - name: Build AdminServer Docker image
      run: |
        GIT_COMMIT=$(git rev-parse HEAD)
        docker build -t admin-server:latest --build-arg GIT_COMMIT=${GIT_COMMIT}  -f ./AdminServer/Dockerfile .
    
    - name: set tag
      run: docker image tag admin-server:latest ghcr.io/lotfiaghel/admin-server:latest
    - name: push image
      run: docker image push ghcr.io/lotfiaghel/admin-server:latest
  build-admin-client:    
    runs-on: ubuntu-latest
    needs: build-tradebase
    if: success()
    steps:
    - uses: actions/checkout@v3
      with:
          submodules: recursive
          token: ${{ secrets.token2 }}
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username:  ${{ github.actor }}
        password: ${{ secrets.token2 }}  
    - name: Build BlazorClient Docker image
      run: |
        GIT_COMMIT=$(git rev-parse HEAD)
        docker build -t admin-client:latest  --build-arg GIT_COMMIT=${GIT_COMMIT}  -f ./AdminClient/Dockerfile .

    - name: set tag
      run: docker image tag admin-client:latest ghcr.io/lotfiaghel/admin-client:latest
    - name: push image
      run: docker image push ghcr.io/lotfiaghel/admin-client:latest
  restart-admin-server:    
    runs-on: ubuntu-latest
    needs: [build-admin-client,build-admin-server]
    steps:
    - name: Deploy and restart services
      run: |
          curl http://213.108.240.78:5000/webhook2